services:
  backend:
    image: python:3.12-alpine
    container_name: arvix-backend
    restart: unless-stopped
    working_dir: /app
    command: sh -c "python backend/server.py"
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 4000
      BACKEND_DB_PATH: /app/backend/arvix.db
    ports:
      - '4000:4000'
    volumes:
      - ./:/app
